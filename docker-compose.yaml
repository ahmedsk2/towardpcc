# ⚠️ DO NOT SWITCH THE BUILD PACK TO THIS FILE. IT CAUSED A PRODUCTION OUTAGE.
#
# Kept, rather than deleted, because the hardening it encodes is correct and the
# three things that broke are now known and written down. Deleting it would lose
# both the working parts and the lesson.
#
# WHAT HAPPENED, 2026-08-08. `build_pack` was switched from `dockerfile` to
# `dockercompose` and this file was deployed. The build succeeded, the container
# started, the hardening applied exactly as intended — ReadonlyRootfs true, both
# tmpfs mounts, cap_drop ALL, no-new-privileges — and the SITE WENT DOWN, 503 on
# every route, for roughly forty minutes.
#
# THREE SEPARATE FAULTS, all of them in this file or in the flip:
#
#   1. NO COOLIFY NETWORK. The service declares none, so it never joined the
#      network the shared Postgres is on. The app came up and then logged
#      `prisma:error Connection terminated due to connection timeout` in a loop.
#   2. NO TRAEFIK LABELS. In dockerfile mode Coolify attaches its own routing
#      labels; in compose mode it does not do so for a service it did not
#      generate. The container had 21 labels and `traefik.enable` was EMPTY, so
#      the proxy had nothing to route to — hence 503 rather than an error page.
#   3. FLIPPING THE BUILD PACK WIPES `dockerfile_location`. This is the one that
#      turned a bad deploy into a long outage. Switching back to `dockerfile`
#      does NOT restore it: the field was left `None`, so every subsequent
#      rebuild failed with `failed to read dockerfile: open Dockerfile: no such
#      file or directory` and produced no container at all. It must be PATCHed
#      back to `/apps/web/Dockerfile` explicitly.
#
# WHAT IS ACTUALLY TRUE ABOUT THE HARDENING, measured on the running container
# rather than assumed. Simple mode already applies the two controls that matter
# most: `CapDrop [ALL]` and `User app`. Only `read_only` and the tmpfs mounts are
# dropped by its allow-list. So the gap this file closes is real but narrow, and
# it is NOT worth another outage without first solving 1 and 2 above.
#
# BEFORE ANY FUTURE ATTEMPT: add the Coolify network and the Traefik labels,
# confirm `dockerfile_location` is restorable, and do it with a rollback window
# agreed in advance. The read-only rootfs itself is proven to boot — that part
# was tested against the live image and was never the problem.
#
# Not to be confused with `docker-compose.prod.yml`, which describes a stack
# that was designed first and is not what runs.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Coolify injects the application's environment and its own Traefik labels;
    # neither is repeated here, because a copy would drift from the source of
    # truth the moment a variable changes in the UI.
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"

    # ── The hardening this file exists for ────────────────────────────────────
    read_only: true
    tmpfs:
      # Node and Next both need a writable temp dir. noexec/nosuid because
      # nothing here should ever be executed.
      - /tmp:rw,noexec,nosuid,size=64m
      # The image optimiser's on-disk cache. Sized generously rather than
      # tightly: a full cache degrades to re-encoding on every request, which is
      # slow rather than broken, but a cache that cannot be written at all
      # crashes the optimiser.
      - /app/apps/web/.next/cache:rw,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      # Blocks setuid escalation inside the container. Not reachable through
      # Coolify's simple-mode allow-list either.
      - no-new-privileges:true

    healthcheck:
      # The app's own readiness endpoint, which is parameterless and returns no
      # version string (SPC-API-005). Coolify's rolling update keeps the OLD
      # container serving until this passes.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
