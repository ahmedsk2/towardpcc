name: towardpcc-prod

# Single-VM KSA production stack (PRD §11). Only Caddy is published (80/443);
# every other service is on the internal network with NO host port. Secrets come
# from the host environment / secret store — never a committed .env. Bring up
# with:  docker compose -f docker-compose.prod.yml up -d
# See docs/runbooks/deploy.md for the full procedure.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?e.g. towardpcc.com}
    depends_on:
      - web

  web:
    image: ${WEB_IMAGE:?built + pushed image ref, e.g. registry/towardpcc-web:sha}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      AUTH_SECRET: ${AUTH_SECRET:?openssl rand -base64 32}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:?openssl rand -base64 32 (decodes to 32 bytes)}
      SUBMISSION_IP_SALT: ${SUBMISSION_IP_SALT:?openssl rand -hex 16}
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:?}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      MAIL_FROM: ${MAIL_FROM:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?}
    volumes:
      # Mount this on an ENCRYPTED block volume in OCI (encryption at rest, §8.1).
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs migrations once on deploy, then exits (docs/runbooks/deploy.md step 4).
  migrate:
    image: ${WEB_IMAGE:?}
    profiles: ["migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    entrypoint:
      [
        "node",
        "node_modules/prisma/build/index.js",
        "migrate",
        "deploy",
        "--schema=packages/db/prisma/schema.prisma",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?}
    depends_on:
      postgres:
        condition: service_healthy

  # Nightly encrypted logical backups (offsite copy to OCI Object Storage is a
  # host-side step — docs/runbooks/backup-restore.md).
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "30"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "12"
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Uptime monitoring — proxied by Caddy at status.${SITE_DOMAIN}.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_data:/app/data

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uptime_data:
