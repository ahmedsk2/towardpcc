version: 2
updates:
  # SHA-pinned actions are safe but frozen — Dependabot bumps the pin (and its
  # version comment) via reviewable PRs so security patches still land.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One PR for routine dev-tooling bumps; security updates come separately.
      dev-dependencies:
        dependency-type: "development"
