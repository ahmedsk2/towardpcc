name: Production checks

# Deliberately NOT part of CI.
#
# These assert facts about the LIVE SITE and live DNS — none of which a pull
# request changes. Running them on push would mean a red build on someone's
# unrelated PR because a DNS record moved or an edge was slow, which is the
# fastest way to train a team to ignore a check.
#
# They run daily instead, and on demand. Between them they close the one gap the
# rest of the suite cannot reach: CI proves the artifact was correct when it left
# the build, and nothing else proves it is still correct in production. That gap
# is also where the /trust page's governing rule was being broken — every claim
# there is meant to be enforced or derived, and the residency claim was
# hand-maintained prose about infrastructure that can change without a line of
# this repository being touched.
on:
  schedule:
    # 06:00 UTC — 09:00 in Riyadh, so a failure is waiting at the start of the
    # working day rather than overnight.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # No install step: both scripts deliberately use only fetch and
      # DNS-over-HTTPS, so they have no dependencies to resolve, nothing to go
      # stale, and no supply chain of their own.

      # Is the infrastructure still where the public copy says it is?
      - name: Residency expectations still hold
        run: node scripts/check-residency.mjs

      # Is the site serving right now the site we built?
      #
      # `always()` because the two answer different questions: a stale CAA
      # record must not hide a defaced calculator page.
      - name: The live site is still the site we built
        if: always()
        run: node scripts/check-integrity.mjs
