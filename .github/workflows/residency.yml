name: Residency

# Deliberately NOT part of CI.
#
# This asserts facts about live infrastructure — DNS records, which edge answers
# for the hostname — none of which a pull request changes. Running it on push
# would mean a red build on someone's unrelated PR because a DNS record moved,
# which is the fastest way to train a team to ignore a check.
#
# It runs daily instead, and on demand. What it protects is the /trust page's
# governing rule: every claim there is either enforced by something that runs on
# each release, or derived from data in this repository. The residency claim was
# the lone exception — hand-maintained prose about infrastructure that can change
# without a line of this repo being touched.
on:
  schedule:
    # 06:00 UTC — 09:00 in Riyadh, so a failure is waiting at the start of the
    # working day rather than overnight.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # No install step: the check deliberately uses only fetch and DNS-over-HTTPS
      # so it has no dependencies to resolve and nothing to go stale.
      - name: Residency expectations still hold
        run: node scripts/check-residency.mjs
