name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run when a newer commit lands on the same ref. Pushing
# three times in five minutes used to bill three full runs, two of which nobody
# would ever read. Not applied to main, where each commit's result is the record
# of whether that commit was good.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which of the expensive jobs actually need to run.
  #
  # A full run costs about 11 minutes: e2e, lighthouse and container are roughly
  # 8 of those. This repository carries a lot of documentation — runbooks, ADRs,
  # a launch-blockers file edited several times a day — and every one of those
  # commits was paying the full 11 minutes to prove that a markdown file had not
  # broken a Playwright test. That exhausted a 2,000-minute allowance.
  #
  # `quality` still runs on every commit regardless, because it is what catches
  # prettier drift in exactly those markdown files, and it is the cheap one.
  #
  # Uses plain git rather than a paths-filter action: this repository pins every
  # third-party action to a 40-character SHA, and adding a dependency to decide
  # whether to run tests is a poor trade for twelve lines of shell.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          # First push to a branch, or a force-push, reports an all-zero or
          # missing base. Fall back to running everything: a false positive
          # costs minutes, a false negative ships untested code.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "no usable base commit — running everything"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          # Anything that is not documentation counts as code. Deliberately
          # inverted — an unknown new path type runs the full suite rather than
          # silently skipping it.
          if echo "$CHANGED" | grep -qvE '^(docs/|.*\.md$|LICENSE$|\.claude/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only — skipping e2e, lighthouse and container"
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Route JS budget (PRD §10, gzipped)
        run: pnpm --filter @towardpcc/web budget:check

  deps:
    # Dependency-vulnerability gate (PRD §9): fail on a known high/critical in
    # anything that actually ships. Dev-tool advisories are excluded (--prod).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --audit-level=high

  e2e:
    # TM-001 runtime privacy invariant: the calculators must compute with the
    # network cut off and leak no input data. Separate job — needs a browser.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @towardpcc/web exec playwright install --with-deps chromium
      - name: Run privacy-invariant e2e (builds + serves prod, airplane mode)
        run: pnpm --filter @towardpcc/web test:e2e

  lighthouse:
    # Performance budgets on the calculator pages (PRD §10). JS-size and CLS are
    # hard gates; timing metrics warn until calibrated on this consistent runner.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @towardpcc/web build
      - name: Lighthouse CI budgets (calculator pages)
        run: pnpm --filter @towardpcc/web lighthouse

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan git history for secrets
        run: /tmp/gitleaks git --no-banner --redact --log-level debug .

  # Container build + scan (P8, threat-model TM-007 / prod-readiness).
  # The Dockerfile is hardened — non-root, HEALTHCHECK, digest-pinned base,
  # dumb-init — but until now nothing built or scanned it in CI, so a
  # vulnerable base layer or a regression in that hardening would only have
  # surfaced on the production host.
  container:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: apps/web/Dockerfile
          # DL3018 (pin apk versions) is not enforced: the base image is already
          # pinned by digest, so the package set is reproducible without also
          # pinning every apk, which would rot fast and block security updates.
          ignore: DL3018
          failure-threshold: warning

      - name: Build the production image
        run: docker build -f apps/web/Dockerfile -t towardpcc-web:ci .

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: towardpcc-web:ci
          format: table
          # Fail the build on HIGH/CRITICAL only. MEDIUM and below in a base
          # image are near-permanent noise; gating on them trains people to
          # ignore the job, which is worse than not having it.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify the image runs as a non-root user
        run: |
          UID_IN_IMAGE=$(docker run --rm --entrypoint sh towardpcc-web:ci -c 'id -u')
          echo "image runs as uid ${UID_IN_IMAGE}"
          test "${UID_IN_IMAGE}" != "0"

      - name: Verify Prisma's WASM query compiler shipped
        # Next's standalone tracer omits it, which makes every query fail with
        # ENOENT at runtime while /api/v1/health still returns 200. It has been
        # missed once already; asserting it here is cheaper than finding out in
        # production via /api/v1/ready.
        run: |
          docker run --rm --entrypoint sh towardpcc-web:ci -c \
            'find / -name "query_compiler_bg.wasm" -not -path "*/proc/*" 2>/dev/null | head -1 | grep -q . '

      # An inventory of what is actually inside the image, kept as a build
      # artifact. Trivy above answers "are there known vulnerabilities today";
      # this answers the question you get asked at 2am months later — "are we
      # affected by the thing announced this morning" — which you cannot answer
      # from a scan that ran against a different image than the one deployed.
      #
      # SPDX rather than CycloneDX for no strong reason beyond it being the
      # format most downstream tooling reads without configuration.
      - name: Generate an SBOM for the image
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.17.9
        with:
          image: towardpcc-web:ci
          format: spdx-json
          artifact-name: towardpcc-web-sbom.spdx.json
          output-file: towardpcc-web-sbom.spdx.json

      - name: Keep the SBOM with the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: towardpcc-web-sbom.spdx.json
          retention-days: 90
